<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Магазин Игрушек</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <section class="sub_header">
          <nav class="sub_nav">
            <ul class="sub_nav_list">
              <li class="sub_nuv_item">
                <a href="#" class="sub_nuv_item_link">Доставка</a>
              </li>
              <li class="sub_nuv_item">
                <a href="#" class="sub_nuv_item_link">Контакты</a>
              </li>
              <li class="sub_nuv_item">
                <div class="dropdown">
                  <a href="#" class="sub_nuv_item_link">О нас</a>
                  <img
                    src="./images/drop_arrow_down.svg"
                    alt="drop_arrow_down_icon"
                    class="color_svg"
                  />
                  <div class="dropdown_content">
                    <div class="dropdown_container">
                      <a href="#" class="dropdown_list_item_link">Доставка</a>
                      <a href="#" class="dropdown_list_item_link">Оплата</a>
                      <a href="#" class="dropdown_list_item_link">Контакты</a>
                      <a href="#" class="dropdown_list_item_link"
                        >Новости и события</a
                      >
                    </div>
                  </div>
                </div>
              </li>
            </ul>
          </nav>
          <div class="sub_social">
            <ul class="sub_social_list">
              <li class="sub_social_list_item">
                <img
                  src="./images/phone.svg"
                  alt="phone_icon"
                  class="color_svg"
                />
                <a href="tel:+380681658805" class="sub_social_list_item_link">
                  +38 (068) 165-88-05
                </a>
              </li>
              <li class="sub_social_list_item">
                <ul class="sub_social_list_item_list">
                  <li class="sub_social_list_item_list_item">
                    <a href="#" class="sub_social_list_link">
                      <img
                        src="./images/youtube.svg"
                        alt="youtube_icon"
                        class="color_svg"
                      />
                    </a>
                  </li>
                  <li class="sub_social_list_item_list_item">
                    <a href="#" class="sub_social_list_link">
                      <img
                        src="./images/telegram.svg"
                        alt="telegram_icon"
                        class="color_svg"
                      />
                    </a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </section>
        <section class="below_header">
          <div class="loco_container">
            <a href="#" class="logo_link">
              <img src="./images/logo.svg" alt="logo_icon" class="logo" />
            </a>
          </div>
          <ul class="below_header_transfer_list">
            <li class="below_header_transfer_list_item">
              <a href="#" class="below_header_transfer_list_item_link">
                <img src="./images/marker_white.svg" alt="" />
                <p class="below_header_transfer_list_item_text">
                  Доставка по всей России
                </p>
              </a>
            </li>
            <li class="below_header_transfer_list_item">
              <a href="#" class="below_header_transfer_list_item_link">
                <img src="./images/marker_white.svg" alt="" />
                <p class="below_header_transfer_list_item_text">
                  Самовывоз по Москве
                </p>
              </a>
            </li>
          </ul>
          <a href="#" class="basket_block">
            <img
              src="./images/basket.svg"
              alt="basket_icon"
              class="color_svg"
            />
            <p class="count_products_in_basket">1299 штук</p>
            <p class="price_products_in_basket">На сумму 100 369 ₽</p>
          </a>
        </section>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="container"></div>
      </section>
    </main>
    <footer class="footer">
      <div class="container"></div>
    </footer>
  </body>
</html>
