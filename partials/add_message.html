<section class="add_message">
  <div class="container">
    <img src="../images/add_message_star1.svg" alt="" class="star1" />
    <img src="../images/add_message.svg" alt="" class="add_mess_img" />
    <img src="../images/add_message_star2.svg" alt="" class="star2" />
    <div class="add_message_main">
      <h2 class="add_message_title">Получить предложение</h2>
      <p class="add_message_text">
        Мы отправим Вам на почту подробное письмо о наших возможностях и
        уникальных условиях СПЕЦИАЛЬНО для вашего бизнеса!
      </p>
    </div>

    <form class="contact-form">
      <div class="contact_block">
        <div class="form-fields">
          <input type="text" placeholder="Имя" required />

          <input type="tel" placeholder="Телефон" required />

          <input type="email" placeholder="E-mail" required />

          <input type="text" placeholder="Город" />
        </div>

        <div class="form-message">
          <textarea
            placeholder="Напишите, что вас заинтересовало или свой вопрос. Мы сможем подготовиться к нашей беседе"
          ></textarea>
        </div>
      </div>

      <div class="form-bottom">
        <label class="form-checkbox">
          <input type="checkbox" required checked />
          <span>Я принимаю условия передачи информации</span>
        </label>

        <button type="submit">Отправить заявку</button>
      </div>
    </form>
  </div>
</section>
